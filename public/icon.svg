<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="40%" stop-color="#043828" />
      <stop offset="100%" stop-color="#022117" />
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <radialGradient id="emeraldGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Jade Gradient for geometric lines -->
    <linearGradient id="jadeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Container Base Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.35" />
  
  <!-- Subtle Glow -->
  <circle cx="256" cy="256" r="210" fill="url(#emeraldGlow)" />

  <!-- Outer Islamic 8-Pointed Star (Rub el Hizb) Subtle Geometric Frame -->
  <g transform="translate(256 256)" opacity="0.25">
    <rect x="-140" y="-140" width="280" height="280" rx="18" fill="none" stroke="#34d399" stroke-width="2" />
    <rect x="-140" y="-140" width="280" height="280" rx="18" fill="none" stroke="#34d399" stroke-width="2" transform="rotate(45)" />
  </g>

  <!-- Mihrab / Dome Elegant Silhouette -->
  <path d="M 186 380 L 186 280 C 186 220 220 180 256 156 C 292 180 326 220 326 280 L 326 380 Z" 
        fill="none" 
        stroke="url(#jadeGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.5" />

  <!-- Radiant Gold Crescent Moon -->
  <path d="M 276 172 A 92 92 0 1 0 356 324 A 80 80 0 1 1 276 172 Z" 
        fill="url(#goldGrad)" 
        filter="drop-shadow(0 6px 16px rgba(245, 158, 11, 0.4))" />

  <!-- 8-Pointed Star (Kawkab) at the Heart of the Crescent -->
  <g transform="translate(315 220) scale(1.15)">
    <path d="M 0 -22 L 5 -7 L 20 -5 L 8 4 L 12 19 L 0 10 L -12 19 L -8 4 L -20 -5 L -5 -7 Z" 
          fill="#ffffff" 
          filter="drop-shadow(0 0 10px rgba(255, 255, 255, 0.8))" />
    <circle cx="0" cy="0" r="3.5" fill="#f59e0b" />
  </g>

  <!-- Clean Base Architectural Arc Accent -->
  <path d="M 216 380 C 236 368 276 368 296 380" 
        stroke="url(#goldGrad)" 
        stroke-width="4" 
        stroke-linecap="round" 
        opacity="0.8" />
</svg>
